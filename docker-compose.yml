services:
  analysis:
    build:
      context: .
      secrets:
        - github_token
    container_name: pulsoats-analysis
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate-analysis:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    volumes:
      - analysis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=:50051 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  analysis-data:
