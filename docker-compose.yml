services:
  analysis:
    build:
      context: .
      secrets:
        - github_token
    env_file:
      - path: .env
        required: false
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    volumes:
      - analysis_data:/data
    restart: unless-stopped

volumes:
  analysis_data:

secrets:
  github_token:
    environment: GITHUB_TOKEN
